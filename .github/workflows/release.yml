name: Release

# Pushing a tag like v1.2.0 runs the tests, then builds EarnedSelfFound-v1.2.0.zip
# (version stamped into the TOC) and publishes it as a GitHub release.
# CurseForge / Wago uploads switch on automatically once their project IDs
# are in the TOC (X-Curse-Project-ID / X-Wago-ID) and the matching secrets
# (CF_API_KEY / WAGO_API_TOKEN) are added in the repo settings.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: BigWigsMods/packager@v2
